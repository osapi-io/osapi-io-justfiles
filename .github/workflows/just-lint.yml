---
name: Just Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          # Pinned so CI and a local `mise install` check the same thing. An
          # unpinned version resolved older just, which does not reject
          # undefined variables during a format check -- so a module that
          # could not parse standalone passed here and failed locally.
          just-version: "1.45.0"
      - name: Lint justfiles
        run: just --justfile just.just --working-directory . fmt-check
